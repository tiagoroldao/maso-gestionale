name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    # Chromium and its system packages come preinstalled. The tag must
    # match the exact `playwright` version in package.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maso
          POSTGRES_PASSWORD: maso
          POSTGRES_DB: maso_test
        options: >-
          --health-cmd "pg_isready -U maso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TZ: UTC
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: ci-only-app-key-not-secret-000000
      SESSION_DRIVER: memory
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: maso
      DB_PASSWORD: maso
      DB_DATABASE: maso_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the container matches the installed Playwright version
        run: |
          installed="$(node -p "require('playwright/package.json').version")"
          if ! grep -q "mcr.microsoft.com/playwright:v$installed-" .github/workflows/ci.yml; then
            echo "::error::package.json has playwright $installed; update the container tag in ci.yml to match."
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck

      - name: Tests (unit, functional, browser)
        run: node ace test
        env:
          NODE_ENV: test
