name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    # Chromium and its system packages come preinstalled. The tag must
    # match the exact `playwright` version in package.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maso
          POSTGRES_PASSWORD: maso
          POSTGRES_DB: maso_test
        options: >-
          --health-cmd "pg_isready -U maso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      gotenberg:
        image: gotenberg/gotenberg:8

    env:
      TZ: Europe/Rome
      PORT: 3333
      # Explicit IPv4: inside the container "localhost" resolves to ::1 first
      HOST: 127.0.0.1
      LOG_LEVEL: info
      APP_KEY: ci-only-app-key-not-secret-000000
      SESSION_DRIVER: memory
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: maso
      DB_PASSWORD: maso
      DB_DATABASE: maso_test
      GOTENBERG_URL: http://gotenberg:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # pg_dump and pg_restore 17 for the backup tests (#33), from the
      # PostgreSQL apt repository: Ubuntu's own client is older
      - name: Install the PostgreSQL 17 client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Check the container matches the installed Playwright version
        run: |
          installed="$(node -p "require('playwright/package.json').version")"
          if ! grep -q "mcr.microsoft.com/playwright:v$installed-" .github/workflows/ci.yml; then
            echo "::error::package.json has playwright $installed; update the container tag in ci.yml to match."
            exit 1
          fi

      - name: Generated files are up to date
        run: |
          node ace migration:run --force
          # dev:reset must keep working: fresh drops tables but leaves
          # sequences and functions, so their migrations must be idempotent
          node ace migration:fresh --force
          npm run codegen
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain -- .adonisjs database/schema.ts)" ]; then
            git status --porcelain -- .adonisjs database/schema.ts
            git diff -- .adonisjs database/schema.ts
            echo "::error::Generated files are stale. Run 'npm run codegen' (with migrations applied) and commit the result."
            exit 1
          fi
        env:
          NODE_ENV: test

      - run: npm run lint
      - run: npm run typecheck

      - name: Comments waiting on closed issues
        run: npm run check:issue-refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Tests (unit, functional, browser)
        run: node ace test
        env:
          NODE_ENV: test
