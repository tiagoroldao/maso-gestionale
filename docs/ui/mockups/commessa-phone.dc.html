<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Carbonio · Commessa su telefono</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.r{--paper:#fafafa;--card:#ffffff;--ink:#0b0b0c;--muted:#5d6168;--line:#e2e2e5;--bar:#0b0b0c;--btn:#0b0b0c;--btnfg:#ffffff;--blue:#1d56c4;--bluebg:#e6eefc;--orange:#9a4a06;--orangebg:#fcefe0;--green:#17724a;--greenbg:#e3f2e9;--grey:#4f535a;--greybg:#ececef;font-family:Inter,system-ui,sans-serif;font-feature-settings:'tnum' 1;color:var(--ink);background:var(--paper)}
.r.dark{--paper:#0e0e10;--card:#151518;--ink:#ececed;--muted:#9a9ea6;--line:#2a2b30;--bar:#000000;--btn:#ececed;--btnfg:#0b0b0c;--blue:#93b8ff;--bluebg:#172540;--orange:#ffb46b;--orangebg:#3a250f;--green:#62d39c;--greenbg:#11301f;--grey:#b9bcc2;--greybg:#25262b}
.lbl{font-family:Montserrat,Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:3px;font-size:12px;font-weight:600;white-space:nowrap}
.t-blue{color:var(--blue);background:var(--bluebg)}.t-orange{color:var(--orange);background:var(--orangebg)}.t-green{color:var(--green);background:var(--greenbg)}.t-grey{color:var(--grey);background:var(--greybg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px}
.ib{display:grid;place-items:center;width:44px;height:44px;border:0;background:transparent;color:#ffffff;cursor:pointer;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:3px;font:600 15px Inter,system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.p{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.btn.dk{background:#1c1c1f;border-color:#2c2d31;color:#ffffff;min-height:40px;font-size:14px}
.fact{display:flex;flex-direction:column;gap:4px;padding:12px 14px;min-width:0}
</style>
</helmet>
<div class="{{rootClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden;">
  <header style="background: var(--bar); color: #ffffff; padding: 4px 16px 16px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="#" class="ib" aria-label="Indietro: Commesse" style="margin-left: -12px; width: auto; display: flex; gap: 2px; padding-right: 8px; font-size: 14px; color: #c9cacd;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Commesse</a>
      <button class="ib" type="button" aria-label="Menu" style="margin-right: -12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    </div>
    <h1 style="margin: 0; font-family: Montserrat, Inter, sans-serif; font-size: 22px; font-weight: 700;">Sostituzione caldaia</h1>
    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;"><span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 3px; font-size: 12px; font-weight: 700; color: #1a1205; background: #ffb46b;">In corso</span><span style="font-size: 13px; color: #c9cacd;">C-2026-0142 · A consuntivo</span></div>
    <div style="display: flex; gap: 8px; margin-top: 4px;">
      <button class="btn dk" type="button" style="flex: 1;">Nuovo intervento</button>
      <button class="btn dk" type="button" aria-label="Altre azioni" style="width: 40px; padding: 0; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
    <section class="card" aria-label="Riepilogo" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
      <div class="fact"><span class="lbl">Cliente</span><a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none;">Rossi Mario</a></div>
      <div class="fact" style="border-left: 1px solid var(--line);"><span class="lbl">Immobile</span><span style="font-size: 14px; font-weight: 600;">[INDIRIZZO]</span></div>
      <div class="fact" style="border-top: 1px solid var(--line);"><span class="lbl">Da fatturare</span><span style="font-size: 17px; font-weight: 700;">€ 353,00</span></div>
      <div class="fact" style="border-top: 1px solid var(--line); border-left: 1px solid var(--line);"><span class="lbl">Imponibile</span><span style="font-size: 17px; font-weight: 700;">€ 2.388,00</span></div>
    </section>

    <section class="card" aria-labelledby="bm-i">
      <div style="padding: 12px 14px 8px;"><h2 id="bm-i" class="lbl" style="margin: 0; color: var(--ink);">Interventi</h2></div>
      <sc-for list="{{visits}}" as="v" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); text-decoration: none;">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">{{v.date}}</span><span style="font-size: 13px; color: var(--muted);">{{v.time}} · {{v.tech}}</span></div>
          <span class="tag t-{{v.tone}}">{{v.status}}</span>
        </a>
      </sc-for>
    </section>

    <section class="card" aria-labelledby="bm-a">
      <div style="padding: 12px 14px 8px;"><h2 id="bm-a" class="lbl" style="margin: 0; color: var(--ink);">Addebiti</h2></div>
      <sc-for list="{{charges}}" as="c" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line);">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 14px;">{{c.desc}}</span><span><span class="tag t-{{c.tone}}">{{c.state}}</span></span></div>
          <span style="font-size: 15px; font-weight: 700;">€ {{c.total}}</span>
        </div>
      </sc-for>
    </section>
  </div>

  <div style="padding: 10px 14px; background: var(--card); border-top: 1px solid var(--line); flex-shrink: 0;">
    <button class="btn p" type="button" style="width: 100%;">Crea bozza fattura</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rootClass: this.props.dark ? 'r dark' : 'r',
      visits: [
        { date: 'Lun 26 ott', time: '09:00–13:00', tech: 'Luca B.', status: 'Chiuso', tone: 'green' },
        { date: 'Gio 29 ott', time: '14:00–17:00', tech: 'Luca B., Marco T.', status: 'In corso', tone: 'orange' },
        { date: 'Mar 3 nov', time: '08:30–12:00', tech: 'Marco T.', status: 'Pianificato', tone: 'blue' }
      ],
      charges: [
        { desc: 'Caldaia a condensazione 25 kW', total: '1.890,00', state: 'Fatturato', tone: 'green' },
        { desc: 'Kit scarico fumi coassiale', total: '145,00', state: 'In bozza', tone: 'grey' },
        { desc: 'Manodopera idraulico · 6,5 h', total: '273,00', state: 'Da fatturare', tone: 'orange' },
        { desc: 'Smaltimento vecchia caldaia', total: '80,00', state: 'Da fatturare', tone: 'orange' }
      ]
    };
  }
}
</script>
</body>
</html>
