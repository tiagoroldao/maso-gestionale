<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Carbonio · Intervento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.r{--paper:#fafafa;--card:#ffffff;--ink:#0b0b0c;--ink2:#2b2d31;--muted:#5d6168;--line:#e2e2e5;--bar:#0b0b0c;--brand:#ff3030;--btn:#0b0b0c;--btnfg:#ffffff;--orange:#9a4a06;--orangebg:#fcefe0;--greybg:#ececef;font-family:Inter,system-ui,sans-serif;font-feature-settings:'tnum' 1;color:var(--ink);background:var(--paper)}
.r.dark{--paper:#0e0e10;--card:#151518;--ink:#ececed;--ink2:#c3c5c9;--muted:#9a9ea6;--line:#2a2b30;--bar:#000000;--brand:#ff4545;--btn:#ececed;--btnfg:#0b0b0c;--orange:#ffb46b;--orangebg:#3a250f;--greybg:#25262b}
.lbl{font-family:Montserrat,Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:3px;font:600 15px Inter,system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.p{background:var(--btn);color:var(--btnfg);border-color:var(--btn);font-family:Montserrat,Inter,sans-serif;letter-spacing:0.12em;font-size:13px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Montserrat,Inter,sans-serif;font-size:9px;font-weight:600;letter-spacing:0.14em;color:#9a9ca2;text-decoration:none}
.tab.on{color:#ffffff}
.tab.on svg{color:var(--brand)}
</style>
</helmet>
<div class="{{rootClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden;">
  <header style="background: var(--bar); color: #ffffff; padding: 10px 16px 16px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="#" aria-label="Indietro: I miei interventi" style="display: grid; place-items: center; width: 44px; height: 44px; margin-left: -12px; color: #ffffff;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <button type="button" aria-label="Menu" style="display: grid; place-items: center; width: 44px; height: 44px; margin-right: -12px; border: 0; background: transparent; color: #ffffff; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
      <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 3px; font-size: 12px; font-weight: 700; color: #1a1205; background: #ffb46b;">{{inCorso}}</span>
      <span style="font-family: Montserrat, Inter, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: #a9abb0;">GIO 29 OTT · 14:00–17:00</span>
    </div>
    <h1 style="margin: 0; font-family: Montserrat, Inter, sans-serif; font-size: 22px; font-weight: 700;">Intervento · Rossi Mario</h1>
    <div style="font-size: 14px; color: #c9cacd;">Sostituzione caldaia · [INDIRIZZO]</div>
    <div style="display: flex; gap: 8px; margin-top: 2px;">
      <a href="#" class="btn" style="flex: 1; background: #1c1c1f; border-color: #2c2d31; color: #ffffff;">Mappa</a>
      <a href="#" class="btn" style="flex: 1; background: #1c1c1f; border-color: #2c2d31; color: #ffffff;">Chiama</a>
      <button class="btn" type="button" aria-label="Altre azioni" style="width: 46px; padding: 0; flex-shrink: 0; background: #1c1c1f; border-color: #2c2d31; color: #ffffff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <section class="card" aria-labelledby="bv-a">
      <div style="padding: 14px 14px 10px;"><h2 id="bv-a" class="lbl" style="margin: 0; color: var(--ink);">Addebiti</h2></div>
      <sc-for list="{{charges}}" as="c" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line);">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; font-weight: 500;">{{c.desc}}</span>
            <span style="font-size: 13px; color: var(--muted);">{{c.kind}}</span>
          </div>
          <span style="font-size: 16px; font-weight: 700;">{{c.qty}}</span>
        </div>
      </sc-for>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line);">
        <button class="btn" type="button" style="border: 0; border-right: 1px solid var(--line); border-radius: 0;">+ Ore</button>
        <button class="btn" type="button" style="border: 0; border-right: 1px solid var(--line); border-radius: 0;">+ Articolo</button>
        <button class="btn" type="button" style="border: 0; border-radius: 0;">+ Altro</button>
      </div>
    </section>

    <section class="card" aria-labelledby="bv-n" style="padding: 14px; display: flex; flex-direction: column; gap: 12px;">
      <h2 id="bv-n" class="lbl" style="margin: 0; color: var(--ink);">Note e foto</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
        <div aria-label="Foto 1" role="img" style="aspect-ratio: 1; border-radius: 2px; background: var(--greybg);"></div>
        <div aria-label="Foto 2" role="img" style="aspect-ratio: 1; border-radius: 2px; background: var(--greybg);"></div>
        <button class="btn" type="button" aria-label="Aggiungi foto" style="aspect-ratio: 1; padding: 0; min-height: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
      </div>
    </section>
  </div>

  <div style="padding: 10px 16px; background: var(--card); border-top: 1px solid var(--line); flex-shrink: 0;">
    <button class="btn p" type="button" style="width: 100%;">CHIUDI INTERVENTO</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"capsTags":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rootClass: this.props.dark ? 'r dark' : 'r',
      inCorso: (this.props.capsTags ?? false) ? 'IN CORSO' : 'In corso',
      charges: [
        { desc: 'Manodopera idraulico', kind: 'Ore · Luca B.', qty: '3 h' },
        { desc: 'Kit scarico fumi coassiale', kind: 'Articolo · dal furgone', qty: '1' },
        { desc: 'Smaltimento vecchia caldaia', kind: 'Altro', qty: '1' }
      ]
    };
  }
}
</script>
</body>
</html>
