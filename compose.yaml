# Full Instance stack (ADR 0002). For local development run only the
# backing services with `docker compose up -d db gotenberg` and `npm run dev`.
services:
  app:
    build: .
    image: ${APP_IMAGE:-ghcr.io/tiagoroldao/maso-gestionale}:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment: &app-environment
      NODE_ENV: production
      TZ: Europe/Rome
      HOST: 0.0.0.0
      PORT: 3333
      DB_HOST: db
      DB_PORT: 5432
      GOTENBERG_URL: http://gotenberg:3000
      STORAGE_PATH: /app/storage
    volumes:
      - app-storage:/app/storage
    ports:
      - '${APP_PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started

  # Nightly encrypted off-site backups (#33): the app image running the
  # backup job instead of the server. Settings and status are in Instance
  # settings; restoring is in docs/restore.md. The app runs the migrations.
  backup:
    build: .
    image: ${APP_IMAGE:-ghcr.io/tiagoroldao/maso-gestionale}:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    entrypoint: ['node', 'ace']
    command: ['backup:schedule']
    volumes:
      - app-storage:/app/storage:ro
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  # The SDI poller (#92, ADR 0019): polls the intermediary for outcomes and
  # Supplier Invoices on the interval set in Instance settings. With no
  # connection configured it only waits.
  sdi:
    build: .
    image: ${APP_IMAGE:-ghcr.io/tiagoroldao/maso-gestionale}:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    entrypoint: ['node', 'ace']
    command: ['sdi:poll']
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-maso}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maso}
      POSTGRES_DB: ${DB_DATABASE:-maso}
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-maso}']
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Documents hold user-written template text: no JavaScript, and nothing
    # loaded but the page itself and inline (data:) images
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^(file:///tmp/|data:)
    ports:
      # Published on localhost only, for development; the app reaches it
      # over the Compose network
      - '127.0.0.1:${GOTENBERG_PORT:-3010}:3000'

volumes:
  db-data:
  app-storage:
