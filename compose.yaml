# Full Instance stack (ADR 0002). For local development run only the
# backing services with `docker compose up -d db gotenberg` and `npm run dev`.
services:
  app:
    build: .
    image: ${APP_IMAGE:-ghcr.io/tiagoroldao/maso-gestionale}:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Rome
      HOST: 0.0.0.0
      PORT: 3333
      DB_HOST: db
      DB_PORT: 5432
      GOTENBERG_URL: http://gotenberg:3000
      STORAGE_PATH: /app/storage
    volumes:
      - app-storage:/app/storage
    ports:
      - '${APP_PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-maso}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maso}
      POSTGRES_DB: ${DB_DATABASE:-maso}
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-maso}']
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      # Published on localhost only, for development; the app reaches it
      # over the Compose network
      - '127.0.0.1:${GOTENBERG_PORT:-3010}:3000'

volumes:
  db-data:
  app-storage:
